models:
  - name: stg_raw_open_beta_countries
    description: "One row per country available in Open Beta"
    columns:
      - name: country
        description: "Country names."
        tests: [unique]
      - name: ingested_at_ts
        description: "UTC time the row was written to GCS."
      - name: airflow_run_ts
        description: "Airflow logical run timestamp in UTC."